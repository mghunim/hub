<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102A43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HUB">
<meta name="description" content="HUB — Your Community. One Place.">
<title>HUB</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Cairo:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one phone-width app column (max 440px) centered; fixed top bar, scrolling body, bottom tab bar. */
/* HUB palette: Deep Navy #102A43, Sea Teal #168A8A, Sand #E6D3AD, Coral #F27B65, Cream #F8F5ED, Stone #68747D */
:root{
  --bg:#F8F5ED; --page:#E6D3AD; --field:#EFE6D3; --card:#FFFDF8; --line:#E3D8C3;
  --ink:#102A43; --muted:#68747D; --teal:#168A8A; --teal-soft:#CFE5E2; --on-teal:#ffffff;
  --coral:#F27B65; --amber:#D9963A; --red:#E0574A; --green:#2E8B5E; --navy:#102A43; --sand:#E6D3AD;
  --shadow:0 8px 24px rgba(16,42,67,.12);
  --font:"Nunito","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar:"Cairo","Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1D30; --page:#06121F; --field:#15304A; --card:#112840; --line:#21405C;
  --ink:#F3EEE2; --muted:#9AA6AE; --teal:#2BA8A6; --teal-soft:#123F42; --on-teal:#ffffff;
  --coral:#F48A76; --amber:#E8AE5A; --red:#F07466; --green:#4DB282; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1D30; --page:#06121F; --field:#15304A; --card:#112840; --line:#21405C;
  --ink:#F3EEE2; --muted:#9AA6AE; --teal:#2BA8A6; --teal-soft:#123F42; --on-teal:#ffffff;
  --coral:#F48A76; --amber:#E8AE5A; --red:#F07466; --green:#4DB282; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{position:relative;max-width:440px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;overflow:clip}
@media (min-width:480px){.app{box-shadow:var(--shadow);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:10px 12px 6px;min-height:56px}
.top h1{margin:0;text-align:center;font-size:19px;font-weight:800;text-wrap:balance}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink);position:relative}
.iconbtn:active{background:var(--field)}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid var(--bg)}
.hubmark{width:96px;height:96px;border-radius:28px;background:var(--navy);display:grid;place-items:center;flex:none}
.hubmark svg{width:62%;height:62%}
.hubmark.sm{width:64px;height:64px;border-radius:20px}
.hubmark.xs{width:34px;height:34px;border-radius:10px}
.word{font-weight:900;letter-spacing:.14em}
.btn.cta{background:var(--coral);box-shadow:0 0 0 5px color-mix(in srgb,var(--coral) 25%,transparent)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 24px;-webkit-overflow-scrolling:touch}
.tabs{flex:none;display:flex;justify-content:space-around;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 16px;border-radius:999px;min-width:72px}
.tab.on{color:var(--ink);background:var(--field)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* type + basics */
.h-hi{font-size:26px;font-weight:900;margin:2px 0 0}
.sub{color:var(--muted);font-weight:600;font-size:13.5px}
.unitline{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;color:var(--ink)}
.unitline svg{width:16px;height:16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h2{margin:0;font-size:16px;font-weight:800}
.link{color:var(--teal);font-weight:800;font-size:13.5px}
.lead{text-align:center;font-weight:700;font-size:17px;line-height:1.35;margin:6px auto 26px;max-width:28ch;text-wrap:balance}
.ar{font-family:var(--ar);direction:rtl}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.02em;padding-left:4px}
.in,.sel select,textarea.in{width:100%;border:1.5px solid transparent;background:var(--field);border-radius:18px;padding:17px 20px;font-weight:700;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.in::placeholder,textarea.in::placeholder{color:var(--muted);opacity:.75}
.in:focus,.sel select:focus{border-color:var(--teal)}
.sel{position:relative}
.sel select{padding-right:48px}
.sel select:invalid{color:var(--muted)}
.sel svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none}
textarea.in{min-height:110px;resize:vertical;line-height:1.45}
.seg{display:flex;background:var(--field);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 8px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.err{color:var(--red);font-weight:700;font-size:13px;min-height:18px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 18px;border-radius:18px;font-weight:900;font-size:16.5px;background:var(--teal);color:var(--on-teal);box-shadow:0 0 0 5px var(--teal-soft)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--field);color:var(--ink);box-shadow:none}
.btn.small{width:auto;padding:10px 16px;font-size:14px;border-radius:14px;box-shadow:none}
.btn.danger{background:transparent;color:var(--red);box-shadow:none;border:1.5px solid var(--line)}
.foot{flex:none;padding:12px 22px calc(18px + env(safe-area-inset-bottom,0px))}

/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.qa{background:var(--card);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-weight:800;font-size:13px;text-align:left}
.qa .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.qa .ic svg{width:18px;height:18px}
.tile{background:var(--card);border-radius:18px;padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:150px;justify-content:center}
.tile .art{width:62px;height:62px;border-radius:18px;display:grid;place-items:center}
.tile .art svg{width:32px;height:32px;stroke-width:1.6}
.tile b{font-size:13.5px;line-height:1.25}
.tile .ar{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.4}
.hero{background:var(--card);border-radius:22px;padding:22px;margin-top:16px;display:flex;align-items:center;gap:16px}
.post{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.post .who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-weight:900;color:var(--ink);flex:none;font-size:14px;border:1.5px solid var(--line)}
.avatar.lg{width:64px;height:64px;font-size:22px}
.post p{margin:0;line-height:1.6;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.row .t span{display:block;color:var(--muted);font-weight:600;font-size:12.5px;margin-top:2px}
.pill{font-size:11.5px;font-weight:900;padding:4px 10px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.p-open{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.p-prog{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
.p-closed{background:var(--field);color:var(--muted)}
.p-ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.p-bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--amber) 14%,var(--bg));border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:16px;padding:12px 14px;font-size:13.5px;font-weight:700;margin-top:12px;line-height:1.4}
.banner svg{color:var(--amber);width:20px;height:20px}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:38px 10px;line-height:1.5}
.empty svg{width:40px;height:40px;margin:0 auto 8px;display:block;opacity:.6}
.unitchip{display:flex;justify-content:center;margin:2px 0 14px}
.unitchip .unitline{color:var(--muted);font-size:13px}

/* welcome */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px 26px;text-align:center;gap:10px}
.mark{width:96px;height:96px;border-radius:30px;background:var(--ink);display:grid;place-items:center;margin-bottom:12px}
.mark svg{width:54px;height:54px;color:var(--teal);stroke-width:2}
.welcome h1{font-size:30px;font-weight:900;margin:0;letter-spacing:-.01em}
.welcome p{color:var(--muted);font-weight:600;max-width:30ch;line-height:1.5;margin:0}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:15px;border-radius:18px;background:var(--bg);border:1.5px solid var(--line);font-weight:800;font-size:16px;color:var(--ink)}
.gbtn svg{width:22px;height:22px}
.steps{display:flex;gap:6px;justify-content:center;margin:0 0 6px}
.steps i{width:26px;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--teal)}
.note{font-size:12px;color:var(--muted);font-weight:600;line-height:1.45;text-align:center;margin-top:12px}

/* drawer + sheet */
.scrim{position:absolute;inset:0;background:rgba(8,14,28,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:330px;background:var(--bg);z-index:21;transform:translateX(-102%);transition:transform .24s ease;display:flex;flex-direction:column;padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none;visibility:visible;transition:transform .24s ease}
.drawer{visibility:hidden;transition:transform .24s ease,visibility 0s .24s}
.drawer .me{display:flex;gap:12px;align-items:center;padding:8px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:8px;text-align:left;width:100%}
.drawer nav{flex:1;overflow-y:auto}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:12px 10px;border-radius:12px;font-weight:700;font-size:15px;text-align:left}
.mi:active,.mi:hover{background:var(--field)}
.mi svg{color:var(--muted)}
.mi.mgr{color:var(--teal)} .mi.mgr svg{color:var(--teal)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);z-index:31;border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .26s ease;display:flex;flex-direction:column}
.sheet.on{transform:none;visibility:visible;transition:transform .26s ease}
.sheet{visibility:hidden;transition:transform .26s ease,visibility 0s .26s}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet .sh{padding:6px 20px 0;flex:none}
.sheet .sh h3{margin:6px 0 4px;font-size:19px;font-weight:900}
.sheet .sb{padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#scrim2{z-index:30}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.2s;z-index:40;pointer-events:none;width:max-content;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* badge / pass */
.badge{border-radius:24px;background:var(--ink);color:var(--bg);padding:22px;display:flex;flex-direction:column;gap:16px}
.badge .qr{background:#fff;border-radius:16px;padding:14px;align-self:center;width:max-content}
.badge .qr img,.badge .qr canvas{display:block}
.badge small{opacity:.7;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.badge .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge .kv b{display:block;font-size:15px}
.acc{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acc summary{list-style:none;padding:15px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc[open] summary svg{transform:rotate(180deg)}
.acc ol,.acc ul,.acc p{margin:0;padding:0 18px 16px 34px;line-height:1.6;font-size:14px;color:var(--ink)}
.acc p{padding-left:16px}
.stat{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--muted)}
.offer{min-width:240px;background:var(--card);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center}
.offer .pct{font-size:24px;font-weight:900;color:var(--coral);line-height:1}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.example{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--field);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}
.sel-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="screen" style="display:flex;flex-direction:column;flex:1;min-height:0;padding-top:env(safe-area-inset-top,0px)"></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Menu"></aside>
  <div class="scrim" id="scrim2"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetIn" style="display:flex;flex-direction:column;min-height:0"></div></section>
  <div class="toast" id="toast"></div>
</div>

async function load(){
  const id=D.session.user.id;
  const [profile,communities,units,updates,requests,complaints,passes,notes,violations,notifs]=await Promise.all([
    q(sb.from("profiles").select("*").eq("id",id).single()),
    q(sb.from("communities").select("*").order("district").order("name")),
    q(sb.from("units").select("*, communities(name,district)").eq("user_id",id).order("created_at")),
    q(sb.from("updates").select("*, communities(name)").order("created_at",{ascending:false}).limit(60)),
    q(sb.from("requests").select("*, units(unit_no)").eq("user_id",id).order("created_at",{ascending:false})),
    q(sb.from("complaints").select("*, units(unit_no)").eq("user_id",id).order("created_at",{ascending:false})),
    q(sb.from("gate_passes").select("*, units(unit_no, communities(name))").eq("user_id",id).order("created_at",{ascending:false})),
    q(sb.from("gate_notes").select("*").eq("user_id",id).order("created_at",{ascending:false}).limit(30)),
    q(sb.from("violations").select("*, units(unit_no,user_id)").order("created_at",{ascending:false})),
    q(sb.from("notifications").select("*").eq("user_id",id).order("created_at",{ascending:false}).limit(60)),
  ]);
  Object.assign(D,{profile,communities,units,updates,requests,complaints,passes,notes,notifs,violations:violations.filter(v=>v.units?.user_id===id)});
  if(isMgr())await loadMgr();
}
async function loadMgr(){
  const [units,requests,complaints]=await Promise.all([
    q(sb.from("units").select("*, profiles(full_name,phone,relation,email), communities(name,district)").order("created_at",{ascending:false})),
    q(sb.from("requests").select("*, units(unit_no, communities(name)), profiles(full_name,phone)").neq("status","Closed").order("created_at",{ascending:false})),
    q(sb.from("complaints").select("*, units(unit_no, communities(name)), profiles(full_name,phone)").neq("status","Closed").order("created_at",{ascending:false})),
  ]);
  D.m={units,requests,complaints};
}

let stack=[],route={name:"loading"},tmp={};
function go(name,params={},push=true){if(push&&route)stack.push(route);route={name,...params};closeDrawer();render()}
function back(){route=stack.pop()||{name:isMgr()&&!unit()?"manager":"home"};render()}
function home(tab){stack=[];route={name:tab||(isMgr()&&!unit()?"manager":"home")};render()}
function needsProfile(){const p=D.profile;return !p.full_name||!p.phone||(!isMgr()&&!p.relation)}
async function boot(){
  route={name:"loading"};render();
  const {data}=await sb.auth.getSession();D.session=data.session;
  if(!D.session){route={name:"welcome"};return render()}
  try{await load()}catch(e){route={name:"error",msg:e.message};return render()}
  if(needsProfile())route={name:"profile"};
  else if(!isMgr()&&!D.units.length)route={name:"community"};
  else route={name:isMgr()&&!unit()?"manager":"home"};
  render();
}

function qr(el,text){if(!el)return;el.innerHTML="";try{new QRCode(el,{text,width:168,height:168,colorDark:"#102A43",colorLight:"#ffffff"})}catch(e){el.textContent=text}}

const err=m=>{const e=document.getElementById("err");if(e)e.textContent=m};
async function busy(el,fn){if(el?.disabled)return;if(el)el.disabled=true;try{await fn()}catch(e){toast(e.message||"Something went wrong")}finally{if(el)el.disabled=false}}

/* ---------- actions ---------- */
const A={
 back,boot,closeSheet,drawer:openDrawer,
 tab:el=>home(el.dataset.v), go:el=>go(el.dataset.v),
 seg(el){document.querySelectorAll("#screen input,#screen select,#screen textarea").forEach(i=>{if(i.id&&!i.disabled)tmp["_v_"+i.id]=i.value});
   tmp[el.dataset.k]=el.dataset.v;render();
   Object.keys(tmp).filter(k=>k.startsWith("_v_")).forEach(k=>{const i=document.getElementById(k.slice(3));if(i&&!i.disabled&&i.tagName!=="SELECT")i.value=tmp[k]});
   Object.keys(tmp).filter(k=>k.startsWith("_v_")).forEach(k=>delete tmp[k])},
 google:el=>busy(el,async()=>{const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});if(error)throw error}),
 saveProfile:el=>busy(el,async()=>{const name=val("f-name"),phone=val("f-phone").replace(/[\s-]/g,"");
   if(!name)return err("Enter your full name.");if(!/^(\+?20|0020)?0?1[0125]\d{8}$/.test(phone))return err("Enter an Egyptian mobile number, e.g. 01012345678.");
   const nid=val("f-nid");if(nid&&!/^\d{4}$/.test(nid))return err("Enter exactly 4 digits for the national ID.");
   const patch={full_name:name,phone};if(!isMgr()){patch.relation=tmp.rel||D.profile.relation||"Owner";patch.nid_last4=nid||null}
   D.profile=await q(sb.from("profiles").update(patch).eq("id",D.profile.id).select().single());
   if(route.editing){back();toast("Profile saved")}else{tmp={};boot()}}),
 saveUnit:el=>busy(el,async()=>{const cid=val("f-comm"),u=val("f-unit");
   if(!val("f-district"))return err("Choose your district.");if(!cid)return err("Choose your community.");if(!u)return err("Enter your unit number.");
   if(D.units.some(x=>x.community_id===cid&&x.unit_no.toLowerCase()===u.toLowerCase()))return err("This unit is already on your account.");
   const row=await q(sb.from("units").insert({user_id:D.profile.id,community_id:cid,unit_no:u,unit_type:tmp.utype||"Apartment"}).select("*, communities(name,district)").single());
   lsSet("hub-active",row.id);const wasAdding=route.adding||D.units.length;tmp={};await load();
   if(wasAdding){back();toast("Unit submitted for approval")}else go("submitted",{},false)}),
 switchUnit(){if(D.units.length<2)return go("properties");sheet("Switch unit",D.units.map(u=>`<button class="row" data-a="setUnit" data-v="${u.id}">${I(u.id===unit()?.id?"check":"home")}<div class="t"><b>${esc(u.communities?.name)} · ${esc(u.unit_no)}</b><span>${esc(u.communities?.district)}</span></div>${pill(u.status)}</button>`).join(""))},
 setUnit(el){lsSet("hub-active",el.dataset.v);closeSheet();home("home");toast("Switched unit")},
 addUnit(){tmp={};go("community",{adding:true})},
 newItem(el){const kind=el.dataset.k,t=(kind==="request"?REQUEST_TYPES:SERVICES).find(x=>x.id===el.dataset.v);
   sheet(esc(t.en),`
   ${kind==="service"?`<div class="field"><label for="n-date">Preferred date</label><input class="in" id="n-date" type="date" min="${today()}" value="${today()}"></div>
   <div class="field"><label>Time slot</label><div class="seg" id="slot">${["Morning","Afternoon","Evening"].map((s,i)=>`<button class="${i===0?"on":""}" data-a="pick">${s}</button>`).join("")}</div></div>`:""}
   <div class="field"><label for="n-det">Details</label><textarea class="in" id="n-det" dir="auto" placeholder="Describe what you need"></textarea></div>
   <button class="btn" data-a="submitItem" data-k="${kind}" data-v="${t.id}">${kind==="service"?"Book service":"Submit request"}</button>`,`<span class="ar">${esc(t.ar)}</span> · ${esc(unitLabel(unit()))}`)},
 pick(el){el.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===el))},
 submitItem:el=>busy(el,async()=>{const kind=el.dataset.k;const when=kind==="service"?`${val("n-date")} ${document.querySelector("#slot .on")?.textContent||""}`:null;
   await q(sb.from("requests").insert({kind,type:el.dataset.v,details:val("n-det")||null,preferred_when:when,unit_id:unit().id}));
   closeSheet();tmp[kind==="request"?"rtab":"stab"]="Open";await refresh();toast(kind==="service"?"Service booked":"Request submitted")}),
 newPass(){if(unit()?.status!=="approved")return toast("Available after your unit is approved");
   sheet("Create gate pass",`
   <div class="field"><label for="p-g">Guest name</label><input class="in" id="p-g" placeholder="Guest full name"></div>
   <div class="field"><label for="p-d">Visit date</label><input class="in" id="p-d" type="date" min="${today()}" value="${today()}"></div>
   <div class="field"><label>Valid for</label><div class="seg" id="pv">${["One visit","Full day","One week"].map((s,i)=>`<button class="${i===0?"on":""}" data-a="pick">${s}</button>`).join("")}</div></div>
   <div class="field"><label for="p-c">Car plate (optional)</label><input class="in" id="p-c" placeholder="ا ب ج 123"></div>
   <div class="err" id="perr"></div><button class="btn cta" data-a="savePass">Generate pass</button>`)},
 savePass:el=>busy(el,async()=>{const g=val("p-g");if(!g){document.getElementById("perr").textContent="Enter the guest's name.";return}
   const p=await q(sb.from("gate_passes").insert({guest:g,visit_date:val("p-d"),valid_for:document.querySelector("#pv .on").textContent,car_plate:val("p-c")||null,unit_id:unit().id}).select("id").single());
   closeSheet();await refresh();A.showPass({dataset:{v:p.id}})}),
 showPass(el){const p=D.passes.find(x=>x.id===el.dataset.v);if(!p)return;
   sheet("Gate pass",`<div class="badge"><div class="qr" id="pqr"></div><div class="kv"><div><small>Guest</small><b>${esc(p.guest)}</b></div><div><small>Date</small><b>${fmtDate(p.visit_date)}</b></div><div><small>Host unit</small><b>${esc(p.units?.unit_no)}</b></div><div><small>Valid</small><b>${esc(p.valid_for)}</b></div></div></div>
   <p class="note">Take a screenshot and send it to your guest. Security scans the code at the gate.</p>`,esc(p.units?.communities?.name));
   qr(document.getElementById("pqr"),"HUB-PASS:"+p.id)},
 notifyGate:el=>busy(el,async()=>{if(unit()?.status!=="approved")return toast("Available after your unit is approved");const n=val("g-name");if(!n)return toast("Enter the company or driver name");
   await q(sb.from("gate_notes").insert({kind:tmp.gtype||"Delivery",name:n,plate:val("g-plate")||null,unit_id:unit().id}));await refresh();toast("Gate notified")}),
 newComplaint(){sheet("New complaint",`<div class="field"><label for="c-cat">Category</label>${selHTML("c-cat","Choose a category",COMPLAINT_CATS)}</div>
   <div class="field"><label for="c-t">What happened?</label><textarea class="in" id="c-t" dir="auto" placeholder="Describe the issue, place and time"></textarea></div>
   <div class="err" id="cerr"></div><button class="btn" data-a="saveComplaint">Submit complaint</button>`)},
 saveComplaint:el=>busy(el,async()=>{const c=val("c-cat"),t=val("c-t");if(!c||!t){document.getElementById("cerr").textContent="Choose a category and describe the issue.";return}
   await q(sb.from("complaints").insert({category:c,body:t,unit_id:unit().id}));closeSheet();await refresh();toast("Complaint submitted")}),
 editProfile(){tmp={rel:D.profile.relation};go("profile",{editing:true})},
 askDelete(){sheet("Delete your account?",`<p style="line-height:1.5;margin:0 0 16px">This permanently removes your profile, units, passes, requests and complaints. You will need to sign in and register again.</p><button class="btn" style="background:var(--red);box-shadow:none" data-a="doDelete">Delete my account</button><div style="height:10px"></div><button class="btn ghost" data-a="closeSheet">Keep my account</button>`)},
 doDelete:el=>busy(el,async()=>{const {error}=await sb.rpc("delete_my_account");if(error)throw error;await sb.auth.signOut();closeSheet();stack=[];boot()}),
 logout:async()=>{closeDrawer();await sb.auth.signOut();stack=[];tmp={};boot()},
 /* manager */
 setUnitStatus:el=>busy(el,async()=>{await q(sb.from("units").update({status:el.dataset.s}).eq("id",el.dataset.v));await refresh();toast(el.dataset.s==="approved"?"Resident approved":"Request rejected")}),
 setStatus:el=>busy(el,async()=>{await q(sb.from(el.dataset.k).update({status:el.dataset.s}).eq("id",el.dataset.v));await refresh();toast("Marked "+el.dataset.s.toLowerCase())}),
 publish:el=>busy(el,async()=>{const c=val("m-pc"),t=val("m-post");if(!c)return toast("Choose the community");if(!t)return toast("Write the announcement first");
   await q(sb.from("updates").insert({community_id:c,body:t}));await refresh();toast("Update published")}),
 delUpdate:el=>busy(el,async()=>{await q(sb.from("updates").delete().eq("id",el.dataset.v));await refresh();toast("Update deleted")}),
 issueViolation:el=>busy(el,async()=>{const u=val("m-vu"),r=val("m-vr"),f=val("m-vf");if(!u||!r)return toast("Choose the unit and enter a reason");
   if(f&&!/^\d+(\.\d+)?$/.test(f))return toast("Fine must be a number");
   await q(sb.from("violations").insert({unit_id:u,reason:r,fine:f?Number(f):null,status:f?"Unpaid":"Open"}));await refresh();toast("Violation issued")}),
 editComm(el){const c=D.communities.find(x=>x.id===el.dataset.v)||{};const f=(id,l,v,ph,mode="tel")=>`<div class="field"><label for="${id}">${l}</label><input class="in" id="${id}" value="${esc(v||"")}" placeholder="${ph}" ${mode?`inputmode="${mode}"`:""}></div>`;
   sheet(c.id?"Edit community":"Add community",`
   <div class="field"><label for="k-d">District</label><input class="in" id="k-d" list="k-dl" value="${esc(c.district||"")}" placeholder="e.g. North Coast"><datalist id="k-dl">${districts().map(d=>`<option value="${esc(d)}">`).join("")}</datalist></div>
   ${f("k-n","Community name",c.name,"e.g. Marina Bay Village","")}
   ${f("k-cc","Call center",c.call_center,"e.g. 16xxx")}${f("k-s","Security gate",c.security_phone,"010…")}${f("k-o","Management office",c.office_phone,"02…")}${f("k-m","Maintenance",c.maintenance_phone,"011…")}
   <div class="field"><label for="k-g">Community guidelines</label><textarea class="in" id="k-g" dir="auto" placeholder="Rules residents should follow">${esc(c.guidelines||"")}</textarea></div>
   <div class="err" id="kerr"></div><button class="btn" data-a="saveComm" data-v="${c.id||""}">${c.id?"Save changes":"Add community"}</button>
   ${c.id?`<div style="height:10px"></div><button class="btn danger" data-a="askDelComm" data-v="${c.id}">Delete community</button>`:""}`)},
 saveComm:el=>busy(el,async()=>{const row={district:val("k-d"),name:val("k-n"),call_center:val("k-cc")||null,security_phone:val("k-s")||null,office_phone:val("k-o")||null,maintenance_phone:val("k-m")||null,guidelines:val("k-g")||null};
   if(!row.district||!row.name){document.getElementById("kerr").textContent="Enter the district and community name.";return}
   if(el.dataset.v)await q(sb.from("communities").update(row).eq("id",el.dataset.v));else await q(sb.from("communities").insert(row));
   closeSheet();await refresh();toast(el.dataset.v?"Community saved":"Community added")}),
 askDelComm(el){sheet("Delete community?",`<p style="line-height:1.5;margin:0 0 16px">This also removes every unit, request, complaint, pass and update linked to it. This can't be undone.</p><button class="btn" style="background:var(--red);box-shadow:none" data-a="delComm" data-v="${el.dataset.v}">Delete community</button><div style="height:10px"></div><button class="btn ghost" data-a="closeSheet">Cancel</button>`)},
 delComm:el=>busy(el,async()=>{await q(sb.from("communities").delete().eq("id",el.dataset.v));closeSheet();await refresh();toast("Community deleted")}),
};
const origNotifs=V.notifs;V.notifs=()=>{const unread=D.notifs.filter(n=>!n.read).map(n=>n.id);
  if(unread.length)sb.from("notifications").update({read:true}).in("id",unread).then(()=>D.notifs.forEach(n=>n.read=true));return origNotifs()};

document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener("change",e=>{if(e.target.id==="f-district"){tmp.district=e.target.value;tmp.comm="";tmp.unit=val("f-unit");render()}if(e.target.id==="f-comm")tmp.comm=e.target.value});
$("#scrim").addEventListener("click",closeDrawer);$("#scrim2").addEventListener("click",closeSheet);
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&route.name==="welcome")boot()});
const qs=new URLSearchParams(location.search);if(qs.get("error_description"))setTimeout(()=>toast(qs.get("error_description")),400);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();

</script>
</body>
</html>
